<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Ecommerce</title>

  <!-- Evita erro de favicon -->
  <link rel="icon" href="data:,">

  <link rel="stylesheet" href="css/.css">
</head>
<body>

  <header>
    <h1>Mini Ecommerce</h1>


  </header>

  <main>

    <section class="controls">
      <input type="text" id="search" placeholder="Buscar produto...">

      <select id="category">
        <option value="Todas">Todas</option>
      </select>

      <button id="btnRender">Renderizar</button>
    </section>

    <section>
      <h2>Produtos</h2>
      <div id="product-list"></div>
    </section>

    <section>
      <h2>Detalhes do Produto</h2>
      <div id="product-details"></div>
    </section>

  </main>

  <footer>
    <p> Mini Ecommerce</p>
  </footer>

  <!-- IMPORTANTE: caminho correto do JS -->
  <script src="js/.js"></script>

</body>
</html>
